services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: pymes-app-postgres
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: pymes_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456P
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
