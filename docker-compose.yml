services:
  app:
    build: .
    container_name: pymes-api
    restart: unless-stopped
    ports:
      - "${API_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - APP_AUTH_ADMIN_USERNAME=${APP_AUTH_ADMIN_USERNAME}
      - APP_AUTH_ADMIN_PASSWORD=${APP_AUTH_ADMIN_PASSWORD}
      - APP_AUTH_JWT_SECRET=${APP_AUTH_JWT_SECRET}
      - APP_AUTH_JWT_EXPIRATION_MS=${APP_AUTH_JWT_EXPIRATION_MS}
      - APP_AUTH_JWT_REFRESH_EXPIRATION_MS=${APP_AUTH_JWT_REFRESH_EXPIRATION_MS}
      - APP_SEED_DEMO_DATA=${APP_SEED_DEMO_DATA}
      - SPRING_PROFILES_DEFAULT=${SPRING_PROFILES_DEFAULT}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL}
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}
      - SPRING_JPA_OPEN_IN_VIEW=${SPRING_JPA_OPEN_IN_VIEW}
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS}
