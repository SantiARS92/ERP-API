spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/pymes_app}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456P}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

app.auth.admin.username=${APP_AUTH_ADMIN_USERNAME:admin}
app.auth.admin.password=${APP_AUTH_ADMIN_PASSWORD:1234}
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET:CAMBIAR_ESTA_CLAVE_POR_UNA_LARGA_Y_SEGURA_12345678901234567890}
app.auth.jwt.expiration-ms=${APP_AUTH_JWT_EXPIRATION_MS:28800000}
