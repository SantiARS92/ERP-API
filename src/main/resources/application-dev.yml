spring:
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:file:.env.local[.properties]}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/pymes_app}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456P}
  jpa:
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}

app:
  seed:
    demo-data: ${APP_SEED_DEMO_DATA:true}
