spring:
  application:
    name: pymes-backend
  profiles:
    default: ${SPRING_PROFILES_DEFAULT:prod}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/pymes_app}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456P}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:false}
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW:false}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when-authorized}

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  auth:
    admin:
      username: ${APP_AUTH_ADMIN_USERNAME:admin}
      password: ${APP_AUTH_ADMIN_PASSWORD:1234}
    jwt:
      secret: ${APP_AUTH_JWT_SECRET:CAMBIAR_ESTA_CLAVE_POR_UNA_LARGA_Y_SEGURA_12345678901234567890}
      expiration-ms: ${APP_AUTH_JWT_EXPIRATION_MS:28800000}
      refresh-expiration-ms: ${APP_AUTH_JWT_REFRESH_EXPIRATION_MS:604800000}
  seed:
    demo-data: false
